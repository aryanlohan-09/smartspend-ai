services:
  - type: web
    name: smartspend-ai
    env: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: AUTO_CREATE_TABLES
        value: true
      - key: UPLOAD_FOLDER
        value: /app/app/static/uploads
      - key: MAX_CONTENT_LENGTH_MB
        value: 8
      - key: LOG_LEVEL
        value: INFO
